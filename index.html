    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f7fa;
        --fg: #1a2b3c;
        --muted: #5a6b7c;
        --card: #ffffff;
        --border: #d7e0e8;
        --accent: #1c6fb3;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1922;
          --fg: #e7eef4;
          --muted: #9db0c0;
          --card: #16232f;
          --border: #26384a;
          --accent: #5aa9e6;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        padding: 2rem 1rem;
        font-family:
          system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP",
          sans-serif;
        line-height: 1.7;
        color: var(--fg);
        background: var(--bg);
      }
      header {
        text-align: center;
        max-width: 34rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      header p {
        margin: 0;
        color: var(--muted);
      }
      .cards {
        display: grid;
        gap: 1rem;
        width: 100%;
        max-width: 42rem;
        grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
      }
      .card {
        display: block;
        padding: 1.5rem;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--card);
        color: inherit;
        text-decoration: none;
        transition:
          transform 0.15s ease,
          border-color 0.15s ease;
      }
      .card:hover,
      .card:focus-visible {
        transform: translateY(-2px);
        border-color: var(--accent);
        outline: none;
      }
      .card h2 {
        font-size: 1.2rem;
        margin: 0 0 0.4rem;
        color: var(--accent);
      }
      .card p {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }
      footer {
        color: var(--muted);
        font-size: 0.8rem;
        text-align: center;
      }
    </style>

        <h2>ちがログ</h2>

      </a>
      <a class="card" href="/chiga-bio/">
        <h2>ちがビオ</h2>
        <p>茅ヶ崎の生き物情報サイト。砂浜・磯・海・河口・町中など環境別に地域の生き物を調べられます。</p>
      </a>
    </main>

    <footer>surf90.github.io</footer>
  </body>
